name: TestJava

on:
 push:
pull_request: ["***"]
 pull-request:
  branches: ["main"]
jobs:
 test:
  runs-on: ubunu-latest
  steps:
   - uses: actions/checkout@v4
   - name: Set uo JDK 25
     uses: actions/setup-java@v4
     with:
       java-versiob:'25'
       distribution: 'temurin'
       cache: maven
   - name: Build and run unit tests
     run: mvn -B test